<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>VK TURN Proxy Android</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <p id="demo-banner" role="note"></p>
    <main id="app">
      <section id="home" class="main-screen home-screen" aria-label="VK TURN Proxy">
        <header class="brand"><img src="logo.png" width="30" height="30" alt="" /><h1 data-i18n="app_name">VK TURN Proxy</h1></header>
        <div class="connection-core">
          <button id="connect" class="power-button" aria-label="Connect">
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 10v24"/><path d="M20 17a22 22 0 1 0 24 0"/></svg>
          </button>
          <p id="connection-state" role="status" data-i18n="disconnected"></p>
          <p id="traffic" hidden></p>
        </div>
        <div class="home-controls">
          <button id="profile-select" class="menu-row selected-profile" data-i18n-aria="profiles" aria-label="Connection profiles"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 15h7"/></svg><span id="selected-profile-name"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="home-add-profile" class="primary" data-i18n="add_profile" hidden></button>
          <button class="menu-row account-row" data-open="account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><span><strong data-i18n="account_title"></strong></span><span class="chevron" aria-hidden="true">›</span></button>
        </div>
      </section>
      <section id="settings-page" class="main-screen" hidden aria-labelledby="settings-title">
        <header class="page-heading"><h1 id="settings-title" data-i18n="settings"></h1></header>
        <form id="settings-form" class="settings-card">
          <div class="setting-field"><label for="language" data-i18n="language"></label><select id="language"><option value="en">English</option><option value="ru">Русский</option></select></div>
          <div class="setting-field"><label for="theme" data-i18n="theme"></label><select id="theme"><option value="light" data-i18n="light"></option><option value="dark" data-i18n="dark"></option></select></div>
          <label class="check-row"><span data-i18n="autostart"></span><input id="autostart" type="checkbox" /></label>
          <label class="check-row"><span data-i18n="routing_auto_update"></span><input id="auto-update" type="checkbox" /></label>
          <div class="setting-field"><label for="log-limit" data-i18n="log_limit"></label><input id="log-limit" type="number" min="100" max="10000" required /></div>
          <button type="submit" class="primary" data-i18n="save"></button>
        </form>
        <div class="settings-menu">
          <button class="menu-row" data-open="account"><span data-i18n="account_title"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button class="menu-row" data-open="logs"><span data-i18n="logs"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="app-updates" class="menu-row"><span data-i18n="app_updates"></span><span class="chevron" aria-hidden="true">›</span></button>
        </div>
        <div class="settings-menu about-menu"><button class="menu-row" data-open="about"><span data-i18n="about"></span><span class="chevron" aria-hidden="true">›</span></button></div>
      </section>
      <section id="add-page" class="main-screen" hidden aria-labelledby="add-title">
        <header class="page-heading"><h1 id="add-title" data-i18n="add_profile"></h1></header>
        <form id="import-form">
          <label class="sr-only" for="import-source" data-i18n="import_source"></label>
          <div class="import-line"><input id="import-source" type="text" autocomplete="off" spellcheck="false" /><button id="paste-import" type="button" data-i18n="paste_clipboard"></button></div>
          <button id="continue-import" type="submit" class="primary" data-i18n="continue_import" hidden></button>
        </form>
        <hr class="import-divider" />
        <div class="button-stack import-actions">
          <button id="scan-qr" class="menu-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/></svg><span data-i18n="scan_qr"></span></button>
          <button id="import-from-file" class="menu-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h9l5 5v13H5zM14 3v6h5M9 14h6M9 18h6"/></svg><span data-i18n="import_from_file"></span></button>
        </div>
        <input id="import-file" type="file" accept=".conf,.json,.txt" hidden />
      </section>
      <nav id="bottom-navigation" aria-label="Navigation">
        <button type="button" data-page="home" data-i18n-aria="nav_home" aria-label="Home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H15v-7H9v7H3z"/></svg></button>
        <button type="button" data-page="settings" data-i18n-aria="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.781,2.075 L13.219,2.075 L13.935,4.238 L16.120,5.143 L18.157,4.120 L19.880,5.843 L18.857,7.880 L19.762,10.065 L21.925,10.781 L21.925,13.219 L19.762,13.935 L18.857,16.120 L19.880,18.157 L18.157,19.880 L16.120,18.857 L13.935,19.762 L13.219,21.925 L10.781,21.925 L10.065,19.762 L7.880,18.857 L5.843,19.880 L4.120,18.157 L5.143,16.120 L4.238,13.935 L2.075,13.219 L2.075,10.781 L4.238,10.065 L5.143,7.880 L4.120,5.843 L5.843,4.120 L7.880,5.143 L10.065,4.238 Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button type="button" data-page="add" data-i18n-aria="add_profile" aria-label="Add profile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button>
      </nav>

      <section id="editor" hidden aria-labelledby="editor-title">
        <header class="editor-toolbar">
          <button data-editor-cancel data-i18n="cancel">Отмена</button>
          <h2 id="editor-title" data-i18n="edit_profile">Редактировать профиль</h2>
          <button class="primary" type="submit" form="profile-form" data-i18n="save">Сохранить</button>
        </header>
        <form id="profile-form" class="editor-content">
          <div class="source-modes" role="group" aria-label="Profile format">
            <button type="button" data-mode="link" aria-pressed="true" data-i18n="mode_link">Ссылка / JSON</button>
            <button type="button" data-mode="wireguard" aria-pressed="false" data-i18n="mode_wireguard">WireGuard</button>
          </div>
          <select id="source-mode" hidden aria-label="Profile format">
            <option value="link" data-i18n="mode_link">Ссылка / JSON</option>
            <option value="wireguard" data-i18n="mode_wireguard">WireGuard</option>
          </select>
          <label for="profile-source" data-i18n="link_json_label">Ссылка подключения или JSON</label>
          <textarea id="profile-source" rows="5" spellcheck="false" required></textarea>
          <div class="row source-actions">
            <button id="paste-source" type="button" data-i18n="paste_clipboard">Вставить</button>
            <button id="open-source" type="button" data-i18n="from_file">Из файла</button>
          </div>
          <input id="source-file" type="file" accept=".conf,.json,.txt" hidden />
          <div id="wg-fields" hidden>
            <label for="vk-link" data-i18n="vk_link">Ссылка на звонок VK</label>
            <input id="vk-link" type="text" autocomplete="off" />
            <label for="peer" data-i18n="editor_peer_override">Другой сервер (необязательно)</label>
            <input id="peer" type="text" autocomplete="off" />
            <label for="transport" data-i18n="editor_transport">Транспорт</label>
            <select id="transport"><option value="srtp">SRTP</option><option value="dtls">DTLS</option></select>
          </div>
          <label for="profile-name" data-i18n="editor_name">Название профиля</label>
          <input id="profile-name" type="text" maxlength="120" autocomplete="off" />
          <div class="row fields-row">
            <div>
              <label for="connections" data-i18n="editor_connections_short">Соединения TURN</label>
              <input id="connections" type="number" min="1" max="120" required />
            </div>
            <div>
              <label for="mtu" data-i18n="editor_mtu_short">MTU туннеля</label>
              <input id="mtu" type="number" min="1000" max="1400" required />
            </div>
          </div>
          <label for="turn-transport" data-i18n="editor_turn">Соединение TURN</label>
          <select id="turn-transport">
            <option value="" data-i18n="from_profile">Из профиля</option>
            <option value="tcp">TCP</option><option value="udp">UDP</option>
          </select>
          <details>
            <summary data-i18n="advanced_settings">Дополнительные настройки</summary>
            <label for="dns" data-i18n="editor_dns">DNS-серверы</label>
            <input id="dns" type="text" autocomplete="off" />
            <label for="keepalive" data-i18n="editor_keepalive">Keepalive, секунд (0–65535)</label>
            <input id="keepalive" type="number" min="0" max="65535" />
            <label for="turn-server" data-i18n="editor_turn_server">Адрес TURN-сервера</label>
            <input id="turn-server" type="text" />
            <label for="uplink" data-i18n="editor_uplink">Ограничение отправки</label>
            <input id="uplink" type="number" min="0" />
            <label for="cooldown" data-i18n="editor_cooldown">Пауза между запросами учётных данных</label>
            <input id="cooldown" type="number" min="0" />
            <label for="vk-auth" data-i18n="editor_vk_auth">Требовать вход VK</label>
            <select id="vk-auth"><option value="" data-i18n="from_profile"></option><option value="true" data-i18n="option_yes"></option><option value="false" data-i18n="option_no"></option></select>
            <label for="legacy-captcha" data-i18n="editor_legacy_captcha">Использовать прежнюю капчу</label>
            <select id="legacy-captcha"><option value="" data-i18n="from_profile"></option><option value="true" data-i18n="option_yes"></option><option value="false" data-i18n="option_no"></option></select>
          </details>
          <details id="routing-details">
            <summary data-i18n="routing">Маршрутизация</summary>
            <label for="routing-mode" data-i18n="routing_mode">Режим маршрутизации</label>
            <select id="routing-mode">
              <option value="profile" data-i18n="from_profile">Из профиля</option>
              <option value="" data-i18n="routing_all">Весь трафик через VPN</option>
              <option value="include" data-i18n="routing_include">Выбранные назначения через VPN</option>
              <option value="exclude" data-i18n="routing_exclude">Выбранные назначения напрямую</option>
            </select>
            <button id="geoip" type="button" class="catalog-button" data-i18n="geoip">Страны и сети GeoIP</button>
            <button id="geosite" type="button" class="catalog-button" data-i18n="geosite">Домены GeoSite</button>
            <label for="routing-custom" data-i18n="routing_custom">Свои домены, IP или CIDR (по одному в строке)</label>
            <textarea id="routing-custom" rows="3" maxlength="65536" spellcheck="false"></textarea>
            <label class="check-row"><input id="local-direct" type="checkbox" /><span data-i18n="routing_local">Локальные назначения напрямую</span></label>
            <button id="update-catalogs" type="button" data-i18n="update_catalogs">Обновить каталоги маршрутизации</button>
          </details>
          <button id="delete-profile" type="button" class="delete-profile" data-i18n="delete" hidden></button>
        </form>
      </section>
    </main>

    <dialog id="profile-picker" class="bottom-sheet" aria-labelledby="profile-picker-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-heading"><h2 id="profile-picker-title" data-i18n="choose_profile"></h2><button class="icon-button" data-close data-i18n-aria="close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <div id="profile-list" role="radiogroup" data-i18n-aria="choose_profile"></div>
    </dialog>
    <dialog id="qr-dialog" aria-labelledby="qr-title">
      <header class="sheet-heading"><h2 id="qr-title" data-i18n="scan_qr"></h2><button class="icon-button" data-close data-i18n-aria="close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <video id="qr-video" autoplay muted playsinline></video>
      <p id="qr-status" role="status"></p>
    </dialog>

    <dialog id="about-dialog" aria-labelledby="about-title">
      <h2 id="about-title" data-i18n="about">О приложении</h2>
      <p><a href="https://github.com/artemk1337/vk-turn-proxy-android" target="_blank" rel="noopener noreferrer">https://github.com/artemk1337/vk-turn-proxy-android</a></p>
      <footer class="dialog-actions"><button data-close data-i18n="close">Закрыть</button></footer>
    </dialog>

    <dialog id="account-dialog" aria-labelledby="account-title">
      <h2 id="account-title" data-i18n="account_title">Аккаунт VK</h2>
      <p data-i18n="account_signed_out">Вход не выполнен</p>
      <div class="button-stack">
        <button data-demo-only data-i18n="account_login">Войти в VK</button>
        <button data-demo-only data-i18n="account_import">Импортировать cookies</button>
        <button data-demo-only data-i18n="account_check">Проверить аккаунт</button>
        <button data-demo-only data-i18n="account_logout">Выйти из аккаунта</button>
      </div>
      <footer class="dialog-actions"><button data-close data-i18n="close">Закрыть</button></footer>
    </dialog>

    <dialog id="logs-dialog" aria-labelledby="logs-title">
      <h2 id="logs-title" data-i18n="logs">Журнал</h2>
      <pre id="log-lines"></pre>
      <footer class="dialog-actions">
        <button id="copy-logs" data-i18n="copy_logs">Копировать журнал</button>
        <button data-close data-i18n="close">Закрыть</button>
      </footer>
    </dialog>

    <dialog id="catalog-dialog" aria-labelledby="catalog-title">
      <h2 id="catalog-title"></h2>
      <form id="catalog-form">
        <label for="catalog-search" data-i18n="search">Поиск</label>
        <input id="catalog-search" type="search" autocomplete="off" />
        <div id="catalog-list"></div>
        <footer class="dialog-actions">
          <button id="clear-catalog" type="button" data-i18n="clear_selection">Сбросить выбор</button>
          <button type="button" data-close data-i18n="cancel">Отмена</button>
          <button type="submit" class="primary">OK</button>
        </footer>
      </form>
    </dialog>

    <dialog id="message-dialog" aria-labelledby="message-text">
      <h2 id="message-text"></h2>
      <footer class="dialog-actions"><button data-close>OK</button></footer>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
