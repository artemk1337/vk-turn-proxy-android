name: Android
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: backend/go.sum
      - uses: android-actions/setup-android@v3
      - name: Install Android dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Test backend
        working-directory: backend
        run: go test ./...
      - name: Build Go backend
        run: scripts/build-backend.sh
      - name: Test, lint and build APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vk-turn-proxy-android-debug
          path: app/build/outputs/apk/debug/*.apk
